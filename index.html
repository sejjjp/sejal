<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- The meta refresh tag is what handles the redirect -->
  <meta http-equiv="refresh" content="0; url=https://sejal-kautkar-portfolio.figma.site">

  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/sejal/favicon.png" />
  <!-- Optional: A JavaScript fallback just in case -->
  <script type="text/javascript">
    window.location.href = "https://sejal-kautkar-portfolio.figma.site";
  </script>
</head>

<body>
  <!-- Fallback link for users if the automatic redirect fails -->
  <p>If you are not redirected automatically, <a href="https://sejal-kautkar-portfolio.figma.site">click here</a>.</p>
</body>

</html>
